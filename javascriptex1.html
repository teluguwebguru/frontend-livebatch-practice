<!--doctype standard tag is must for bootstrap-->
<!doctype html>

<html lang="en">
  <head>
    <title>Javascript ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="mystyles.css" />

    <script>
      /*this function demonstrates 
       about output concept 
       in javascript*/

      function f() {
        let a = 10;

        let b = 20;
        let c = a + b;
        document.getElementById("spl").innerHTML = "<h1>Welcome</h1>";
        window.alert(c);
      }
    </script>
  </head>
  <body>
    <button onclick="(() => window.alert('i am arrow function'))()">
      click me
    </button>
    <span id="spl" name="splname"></span>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
