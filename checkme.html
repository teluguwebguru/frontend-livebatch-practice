<!--doctype standard tag is must for bootstrap-->
<!doctype html>

<html lang="en">
  <head>
    <title>Javascript ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <script>
      function f(bn) {
        window.alert("clicked Button " + bn);
      }
    </script>
  </head>
  <body>
    <div id="spl"></div>
    <script>
      for (let i = 0; i < 10; i++) {
        document.getElementById("spl").innerHTML =
          document.getElementById("spl").innerHTML +
          `<br/><button id="b${i}" onclick="f(${i})">Button ${i}</button>`;
      }
    </script>
  </body>
</html>
