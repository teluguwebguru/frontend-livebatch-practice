<!--doctype standard tag is must for bootstrap-->
<!doctype html>
<html lang="en">
  <head>
    <title>functions ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
    <script>
      //functions --> reusable code blocks
      //we can also setup default values to the parameters
      function addxy(a, b = 200) {
        let x = a;
        let y = b;
        let z = x + y;
        return z; // returns value + exit from the function
        console.log("after return statement"); //never executed
      }

      //reusing first time
      let res1 = addxy(15, 20); //15+20
      console.log(`sum of 15,20 is : ${res1}`);

      let p = "TWG";
      let q = " JavaScript Course";
      console.log(p + q);

      //reusing second time
      let res2 = addxy(30, 40); //30+40
      console.log(`sum of 30,40 is : ${res2}`);

      console.log("welcome to functions concept in javascript");

      //reusing third time
      let v1 = 78;
      let v2 = 96;
      let res3 = addxy(v1, v2); //78+96
      console.log(`sum of ${v1},${v2} is : ${res3}`);

      let res4 = addxy(593);
      console.log("res4 result is:" + res4);
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
