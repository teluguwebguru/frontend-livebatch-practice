<!--Javascript Objects-->
<!--doctype standard tag is must for bootstrap-->
<!doctype html>

<html lang="en">
  <head>
    <title>Regex in Javascript ex</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
  </head>
  <body>
    <div id="studname" class="h3"></div>

    <script>
      let x = "We are learning javascript from teluguwebguru on 20 march 2026"; //string
      let p = /[a-z]/g; //pattern

      console.log(p.test(x)); // test returns true/false

      console.log(p.exec(x)); // test returns true/false

      //escape
      y = "we are learning [*]";

      const e = RegExp.escape("[*]");

      const robj = new RegExp(e);

      const op = y.replace(robj, "JavaScript");

      console.log(op);
    </script>
  </body>
</html>
