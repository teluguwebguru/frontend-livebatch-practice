<!--doctype standard tag is must for bootstrap-->
<!doctype html>
<html lang="en">
  <head>
    <title>for Loops ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="mystyles.css" />
    <script>
      function f() {
        let v = Number(document.getElementById("ctr").value);

        for (let i = 1; i <= 10; i++) {
          if (i == v) {
            continue;
          }

          document.getElementById("dest").innerHTML +=
            "<button class='btn btn-primary col-2 m-1'  onclick='f1(" +
            i +
            ")'>Button-" +
            i +
            "</button>";
        }
      }

      function f1(i) {
        alert("button " + i + " clicked");
      }
    </script>
  </head>
  <body>
    <div class="fluid-container border p-5">
      <h1>Loops example program</h1>
      How many Buttons Required? <input type="text" id="ctr" /> <br />
      <button type="button" onclick="f()">Submit</button>
    </div>

    <div class="fluid-container border p-5 row" id="dest"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
