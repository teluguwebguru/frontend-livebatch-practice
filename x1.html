<!--doctype standard tag is must for bootstrap-->
<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
  <h1 class="text-center">Teluguwebguru Registration Form</h1>

    <form action="getdata.py" method="GET" autocomplete="on" class="w-50 mx-auto m-5 p-5 border rounded-3 shadow">
      <label class="form-label" for="un">Username:</label><sup>*</sup>
      <input
        id="un"
        name="uname"
        type="text"
        placeholder="letters+digits"
        required
        class="form-control"
      /><br />

      <label class="form-label" for="fn">Full Name:</label>
      <input type="text" id="fn" name="fullname"  class="form-control"/><br />

      <label class="form-label" for="pwd">Password:</label><sup>*</sup>
      <input
        type="password"
        id="pwd"
        name="password"
        value="twg123"
        readonly
         class="form-control"
      /><br />

      Gender:
      <div class="row">
        <div class="form-check col-1">
      <input type="radio" id="m" name="gender"  class="form-check-input"/>
      <label class="form-check-label" for="m">Male</label>
      </div>

       <div class="form-check col-1">
      <input type="radio" id="f" name="gender"  class="form-check-input"/>
      <label class="form-check-label" for="f">Female</label> <br />
      </div>
      </div>
      <br />
      Languages Known:
       <div class="row">
      <div class="form-check col-1">
      <input type="checkbox" id="t" name="tel"  class="form-check-input"/>
      <label class="form-check-label" for="t">Telugu</label>
      </div>

      <div class="form-check col-1">
      <input type="checkbox" id="e" name="eng"  class="form-check-input"/>
      <label class="form-check-label" for="e">English</label>
      </div>

      <div class="form-check col-1">
      <input type="checkbox" id="h" name="hin"  class="form-check-input"/>
      <label class="form-check-label" for="h">Hindi</label><br />
      </div>
</div>
<br/>

      <label class="form-label" for="em">Email ID:</label>
      <input type="email" id="em" name="email" autofocus  class="form-control"/><br />

      <label class="form-label" for="mob">Mobile:</label>
      <input type="tel" id="mob" name="mobile" placeholder="+91-7013484024"  class="form-control"/>

      <br />
      <fieldset>
        <legend>DOB</legend>
        <label class="form-label" for="dob">Date of Birth:</label>
        <input
          type="date"
          id="dob"
          name="birthdate"
          min="2000-01-01"
          max="2010-12-31"
           class="form-control"
        /><br />

        <label class="form-label" for="tob">Time of Birth:</label>
        <input type="time" id="tob" name="birthtime"  class="form-control"/>
      </fieldset>

      <br />

      <label class="form-label" for="proflink">Profile URL</label>
      <input type="url" id="proflink" name="profile"  class="form-control"/><br />

      <label class="form-label" for="c">Favorite Color:</label>
      <input type="color" id="c" name="clr"  class="form-control"/><br />

      <label class="form-label" for="b">How many cricket bats required:</label>
      <input type="range" min="0" max="5" id="b" name="bat"  class="form-range"/><br />

      <label class="form-label" for="addr">Address</label>
      <textarea rows="5" cols="30"> </textarea>
      <br />

      <label class="form-label" for="cntry">country</label>
      <select id="cntry" name="country" class="form-select">
        <option>IN</option>
        <option>US</option>
        <option>UK</option></select
      ><br />

      <label class="form-label" for="fc">mention favorite color for gift:</label>
      <input list="clrs" id="fc" name-="fc"  class="form-control"/>

      <datalist id="clrs">
        <option value="Red"></option>
        <option value="Green"></option>
        <option value="Blue"></option>
      </datalist>

      <br />

      <label class="form-label" for="cv">Upload CV:</label>
      <input type="file" id="cv" name="cv" multiple  class="form-control"/><br />

      <input type="reset"  class="form-control bg-info"/>

      <input type="submit" value="Register"  class="form-control bg-success"/>
    </form>
  </body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
