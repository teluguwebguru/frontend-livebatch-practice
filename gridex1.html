<!doctype html>
<html>
  <head>
    <title>Grid Layout Example</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <style type="text/css">
      div.container {
        display: grid;
        grid-template-areas:
          "he he he he he he"
          "s1 s1 s1 s2 s2 s2"
          "s3 s4 s4 s4 s4 s4"
          "fe fe fe fe fe fe";
        border: 3px solid green;
      }
      div.container div {
        border: 1px solid grey;
        padding: 20px;
      }
      div.hclass {
        grid-area: he;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      div.s1class {
        grid-area: s1;
      }
      div.s2class {
        grid-area: s2;
      }
      div.s3class {
        grid-area: s3;
      }
      div.s4class {
        grid-area: s4;
      }
      div.fclass {
        grid-area: fe;
      }
      .navmenu ul {
        list-style-type: none;
      }
      .navmenu ul li {
        display: inline;
      }

      .navmenu ul li a {
        text-decoration: none;
        padding: 10px;
      }
      .navmenu ul li a:hover {
        background-color: yellow;
        color: red;
        border: 1px solid grey;
        border-radius: 20px;
      }
      .logopart {
        border: 0px solid red;
        display: flex;
      }
      .loginbtn {
        border: 1px solid red;
      }
      .btn {
        padding: 2px 10px;
        background-color: green;
        color: white;
        border-radius: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="hclass">
        <div class="logopart" style="border: none">
          <div style="border: none"><img src="images/smalllogo.png" /></div>
          <div class="cname" style="border: none">teluguwebguru</div>
        </div>
        <nav class="navmenu">
          <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Courses</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </nav>
        <div class="loginbtn" style="border: none">
          <button class="btn">LOGIN</button>
        </div>
      </div>

      <div class="s1class">section-1</div>
      <div class="s2class">section-2</div>
      <div class="s3class">section-3</div>
      <div class="s4class">section-4</div>
      <div class="fclass">Footer</div>
    </div>
  </body>
</html>
