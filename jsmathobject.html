<!--Javascript Objects-->
<!--doctype standard tag is must for bootstrap-->
<!doctype html>

<html lang="en">
  <head>
    <title>Math in Javascript</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
  </head>
  <body>
    <script>
      console.log(Math.round(4.7));
      console.log(Math.round(4.3));

      console.log(Math.ceil(4.7));
      console.log(Math.ceil(4.3));

      console.log(Math.floor(4.7));
      console.log(Math.floor(4.3));

      console.log(Math.trunc(4.5));

      console.log(Math.sign(-7));
      console.log(Math.sign(7));
      console.log(Math.sign(0));

      console.log(Math.pow(4, 3));

      console.log(Math.sqrt(81));

      console.log(Math.abs(-4.3));

      console.log(Math.sin(-5.6));
      console.log(Math.cos(-3.6));

      console.log(Math.max(23, 45, 22, 11, 67, 89));
      console.log(Math.min(23, 45, 22, 11, 67, 89));

      console.log(Math.random()); //0-1
      console.log(Math.log2(8));
      console.log(Math.log10(8));
    </script>
  </body>
</html>
