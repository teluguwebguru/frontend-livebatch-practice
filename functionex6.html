<!--Call by Object/Reference-->
<!--doctype standard tag is must for bootstrap-->
<!doctype html>
<html lang="en">
  <head>
    <title>functions ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
    <script>
      //functions --> reusable code blocks
      //call by object/call by reference - parameter changes effects arguments
      function show(a) {
        a.name = "s2";
        a.marks = 55;
        return a;
      }

      //reusing first time
      let v1 = { name: "s1", marks: 89 }; //object

      console.log(`v1 before function call are  ${v1.name},${v1.marks}`);

      let res1 = show(v1); //function call

      console.log(`v1 after function call are  ${v1.name},${v1.marks}`);

      console.log(`result  is : ${res1.name},${res1.marks}`);
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
