<!--Call by value-->
<!--doctype standard tag is must for bootstrap-->
<!doctype html>
<html lang="en">
  <head>
    <title>functions ex1</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale:1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="mystyles.css" />
  </head>
  <body>
    <script>
      //functions --> reusable code blocks
      //call by value - parameter changes won't effect arguments
      function addxy(a, b) {
        a = 44;
        b = 55;

        return a + b;
      }

      //reusing first time
      let v1 = 89;
      let v2 = 57;

      console.log(`v1 and v2 values before function call are  ${v1}, ${v2}`);

      let res1 = addxy(v1, v2); //function call

      console.log(`v1 and v2 values after function call are  ${v1}, ${v2}`);

      console.log(`sum  is : ${res1}`);
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
